# ═══════════════════════════════════════════════════════════════
# Naukri.com — Daily Resume Upload Workflow
# Runs Fully on GitHub Cloud Runners
# ═══════════════════════════════════════════════════════════════

name: 📄 Daily Resume Upload - Naukri.com

on:
  # ── Scheduled Runs ────────────────────────────────────────
  schedule:
    - cron: '0 3 * * *'    # 8:30 AM IST
    - cron: '0 10 * * *'   # 3:30 PM IST

  # ── Manual Trigger ────────────────────────────────────────
  workflow_dispatch:
    inputs:
      run_reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'

jobs:

  # ═══════════════════════════════════════════════════════════
  # Resume Upload Job
  # ═══════════════════════════════════════════════════════════

  update-resume:
    name: 🚀 Upload Resume to Naukri

    # ✅ GitHub Hosted Runner
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      CI: true
      NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
      NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}

    steps:

      # ── Step 1: Checkout Repository ──────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Setup Node.js ────────────────────────────
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Step 3: Install Dependencies ─────────────────────
      - name: 📦 Install dependencies
        run: npm ci

      # ── Step 4: Install Playwright Browsers ──────────────
      - name: 🌐 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # ── Step 5: Run Resume Upload Automation ─────────────
      - name: 🎯 Execute Resume Upload Test
        run: npx playwright test tests/update-resume.spec.ts

      # ── Step 6: Upload Test Results on Failure ───────────
      - name: 📸 Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-artifacts-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      # ── Step 7: Upload Playwright HTML Report ────────────
      - name: 📊 Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════
  # Email Notification Job
  # ═══════════════════════════════════════════════════════════

  notify:
    name: 📧 Send Email Notification

    runs-on: ubuntu-latest

    needs: update-resume

    if: always()

    steps:

      - name: 📧 Send Build Status Email
        uses: dawidd6/action-send-mail@v3
        with:

          # ── SMTP Configuration ───────────────────────────
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          # ── Email Metadata ───────────────────────────────
          subject: |
            ${{ needs.update-resume.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }} | Naukri Resume Upload | Run #${{ github.run_number }}

          to: ${{ secrets.EMAIL_USERNAME }}

          from: Naukri Bot <${{ secrets.EMAIL_USERNAME }}>

          # ── HTML Email Body ──────────────────────────────
          html_body: |
            <div style="font-family: Arial, sans-serif; padding: 20px;">

              <h2>
                ${{ needs.update-resume.result == 'success' && '✅ Resume Upload Successful' || '❌ Resume Upload Failed' }}
              </h2>

              <table style="border-collapse: collapse; width: 100%;">

                <tr>
                  <td style="padding: 10px; border: 1px solid #ccc;"><b>Status</b></td>
                  <td style="padding: 10px; border: 1px solid #ccc;">
                    ${{ needs.update-resume.result }}
                  </td>
                </tr>

                <tr>
                  <td style="padding: 10px; border: 1px solid #ccc;"><b>Run Number</b></td>
                  <td style="padding: 10px; border: 1px solid #ccc;">
                    #${{ github.run_number }}
                  </td>
                </tr>

                <tr>
                  <td style="padding: 10px; border: 1px solid #ccc;"><b>Branch</b></td>
                  <td style="padding: 10px; border: 1px solid #ccc;">
                    ${{ github.ref_name }}
                  </td>
                </tr>

                <tr>
                  <td style="padding: 10px; border: 1px solid #ccc;"><b>Trigger</b></td>
                  <td style="padding: 10px; border: 1px solid #ccc;">
                    ${{ github.event_name }}
                  </td>
                </tr>

              </table>

              <br>

              <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                 style="background:#0366d6;color:white;padding:12px 20px;
                        text-decoration:none;border-radius:5px;">
                 View Workflow Run
              </a>

            </div>
